<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pocket Planet · Model Gallery</title>
  <style>
    body { margin: 0; background: #0b1220; color: #cbd5e1; font: 12px/1.3 system-ui, sans-serif; }
    #grid { display: grid; grid-template-columns: repeat(var(--cols, 8), 1fr); gap: 6px; padding: 6px; }
    figure { margin: 0; background: #111a2e; border-radius: 8px; overflow: hidden; }
    figcaption { padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    canvas { display: block; width: 100%; aspect-ratio: 1; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script type="module" src="./model-gallery.ts"></script>
</body>
</html>
