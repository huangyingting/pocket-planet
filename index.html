<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pocket Planet</title>
  <meta name="description" content="Pocket Planet is a free 3D toy globe for curious kids: spin the Earth, find landmarks and animals, play map games and collect stickers." />
  <meta name="theme-color" content="#09090b" />
  <link rel="preload" href="%BASE_URL%fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="%BASE_URL%fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="%BASE_URL%fonts/chakra-petch-500.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="Pocket Planet" />
  <meta property="og:description" content="Spin a friendly 3D globe, discover landmarks and animals, and play map games." />
  <meta property="og:type" content="website" />
</head>
<body>
  <div id="app"></div>
  <div id="loader" class="intro" role="status" aria-live="polite">
    <div class="intro-sky" aria-hidden="true">
      <i class="intro-neb"></i><i class="intro-mw"></i>
      <i class="intro-l"></i><i class="intro-l"></i><i class="intro-l"></i><i class="intro-l"></i>
      <i class="intro-streaks"></i>
    </div>
    <div class="intro-frame" aria-hidden="true"><i></i><i></i><i></i><i></i>
      <span class="intro-tl">RA 00h 42m 44s<br>DEC +41&deg; 16&prime; 09&Prime;</span>
      <span class="intro-br">SOL &middot; 3RD PLANET<br>1 AU &middot; 12,742 KM</span>
    </div>
    <div class="intro-core">
      <div class="intro-mark" aria-hidden="true"><i class="r1"></i><i class="r2"></i><i class="r3"></i><b></b></div>
      <div class="intro-title">POCKET PLANET</div>
      <p class="intro-sub" id="intro-sub">口袋星球</p>
      <div class="intro-bar" aria-hidden="true"><i></i></div>
      <p class="intro-msg" id="intro-msg">Waking up the planet…</p>
    </div>
  </div>
  <script>
    // Opening sky: star layers painted once, then flown through by compositor-only CSS animations
    // (smooth even while the app boots on the main thread).
    (function () {
      var el = document.getElementById('loader'); if (!el) return;
      var l = null; try { l = JSON.parse(localStorage.getItem('pp.lang')); } catch (e) {}
      if (l !== 'en' && l !== 'zh') l = (navigator.language || '').slice(0, 2) === 'zh' ? 'zh' : 'en';
      document.getElementById('intro-sub').textContent = l === 'zh' ? '口袋星球 · 探索无垠宇宙' : 'A tiny world in an endless sky';
      document.getElementById('intro-msg').textContent = l === 'zh' ? '正在唤醒星球…' : 'Waking up the planet…';
      var small = Math.min(innerWidth, innerHeight) < 700, layers = el.querySelectorAll('.intro-l'), R = Math.random;
      var tint = function (a) { var w = R(); return w < .12 ? 'rgba(255,214,170,' + a + ')' : w < .3 ? 'rgba(170,200,255,' + a + ')' : 'rgba(235,244,255,' + a + ')'; };
      for (var k = 0; k < layers.length; k++) {
        var c = document.createElement('canvas'), S = small ? 512 : 768; c.width = c.height = S;
        var g = c.getContext('2d'), n = small ? 170 : 300;
        for (var i = 0; i < n; i++) {
          var r = Math.pow(R(), 4) * 1.1 + 0.28, a = 0.3 + R() * 0.7, x = R() * S, y = R() * S;
          g.fillStyle = tint(a); g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
          if (r > 1.05) { var gr = g.createRadialGradient(x, y, 0, x, y, r * 5); gr.addColorStop(0, 'rgba(190,225,255,' + a * .35 + ')'); gr.addColorStop(1, 'rgba(190,225,255,0)');
            g.fillStyle = gr; g.fillRect(x - r * 5, y - r * 5, r * 10, r * 10); g.fillStyle = 'rgba(220,240,255,' + a * .5 + ')'; g.fillRect(x - r * 4, y - .4, r * 8, .8); g.fillRect(x - .4, y - r * 4, .8, r * 8); }
        }
        layers[k].style.backgroundImage = 'url(' + c.toDataURL() + ')';
        layers[k].style.animationDelay = (-k * 2.5) + 's';
      }
      // Milky Way: a soft diagonal band of dust and thousands of faint stars, painted once.
      var mw = document.createElement('canvas'), M = small ? 640 : 1024; mw.width = mw.height = M;
      var q = mw.getContext('2d'), gauss = function () { return (R() + R() + R() + R() - 2) / 2; };
      q.translate(M / 2, M / 2); q.rotate(-0.5);
      for (var j = 0; j < 46; j++) { var bx = (R() - .5) * M * 1.3, by = gauss() * M * .07, br = M * (.06 + R() * .1), cg = q.createRadialGradient(bx, by, 0, bx, by, br);
        var hue = R() < .5 ? '120,170,255' : R() < .5 ? '168,140,255' : '120,220,235'; cg.addColorStop(0, 'rgba(' + hue + ',' + (.05 + R() * .05) + ')'); cg.addColorStop(1, 'rgba(' + hue + ',0)');
        q.fillStyle = cg; q.fillRect(bx - br, by - br, br * 2, br * 2); }
      for (var m = 0; m < (small ? 1600 : 3200); m++) { q.fillStyle = 'rgba(225,238,255,' + (.15 + R() * .5) + ')'; q.fillRect((R() - .5) * M * 1.4, gauss() * M * .11, R() < .9 ? .8 : 1.4, R() < .9 ? .8 : 1.4); }
      for (var d = 0; d < 26; d++) { var dx = (R() - .5) * M * 1.2, dy = gauss() * M * .025, dr = M * (.015 + R() * .035), dg = q.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg.addColorStop(0, 'rgba(2,5,12,.55)'); dg.addColorStop(1, 'rgba(2,5,12,0)'); q.fillStyle = dg; q.fillRect(dx - dr, dy - dr, dr * 2, dr * 2); }
      el.querySelector('.intro-mw').style.backgroundImage = 'url(' + mw.toDataURL() + ')';
    })();
  </script>
  <noscript><p class="fatal">Pocket Planet needs JavaScript. Browse the <a href="%BASE_URL%landmarks/">encyclopedia</a> instead.</p></noscript>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
